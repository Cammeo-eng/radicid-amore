<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bem-vindo · animação Radici</title>
<style>
:root{--creme:#F4E6CD;--verde:#3D4C23;--vinho:#931A1A}
html,body{margin:0;background:var(--creme)}
.hero{min-height:100vh;display:grid;place-items:center;padding:24px}
.bem-vindo{width:min(620px,88vw);height:auto;overflow:visible}
/* ===== animação de escrita ===== */
.bem-vindo .letra{
  fill-opacity:0;
  stroke-opacity:0;
  stroke-dasharray:1 1;
  stroke-dashoffset:1;
  animation:escrever var(--dur) cubic-bezier(.45,.05,.35,1) var(--delay) forwards,
            tinta .5s ease-out calc(var(--delay) + var(--dur) * .7) forwards;
}
@keyframes escrever{from{stroke-opacity:1;stroke-dashoffset:1}to{stroke-opacity:1;stroke-dashoffset:0}}
@keyframes tinta{to{fill-opacity:1}}
/* ordem e ritmo da caneta: B longo, pausas curtas entre palavras */
.l1{--delay:.3s;--dur:1.3s}   /* B */
.l2{--delay:1.45s;--dur:.45s} /* e */
.l3{--delay:1.8s;--dur:.6s}   /* m */
.l4{--delay:2.55s;--dur:.2s}  /* - */
.l5{--delay:2.8s;--dur:.45s}  /* v */
.l6{--delay:3.1s;--dur:.2s}   /* traço do i */
.l7{--delay:3.25s;--dur:.45s} /* in */
.l8{--delay:3.6s;--dur:.7s}   /* d */
.l9{--delay:4.15s;--dur:.45s} /* o */
.l10{--delay:4.7s;--dur:.3s}  /* ! */
@media (prefers-reduced-motion:reduce){
  .bem-vindo .letra{animation:none;fill-opacity:1;stroke-opacity:1;stroke-dashoffset:0}
}
.replay{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);font:15px Georgia,serif;color:var(--verde);background:none;border:1px solid var(--verde);padding:10px 20px;cursor:pointer}
